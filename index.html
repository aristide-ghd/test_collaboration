<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Budget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Mon Budget</h2>

    <div class="card solde-card">
        <div class="solde-label">Solde Actuel</div>
        <div id="solde">0.00 €</div>
    </div>

    <div class="summary-grid">
        <div class="summary-item">
            <div class="label">Revenus</div>
            <div id="total-revenus" class="val val-income">0.00 €</div>
        </div>
        <div class="summary-item">
            <div class="label">Dépenses</div>
            <div id="total-depenses" class="val val-expense">0.00 €</div>
        </div>
    </div>

    <div class="card">
        <form id="transaction-form">
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="description" placeholder="Ex: Salaire, Loyer..." required>
            </div>
            <div class="form-group">
                <label>Montant (€)</label>
                <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="type">
                    <option value="depense">Dépense</option>
                    <option value="revenu">Revenu</option>
                </select>
            </div>
            <div class="form-group">
                <label>Catégorie</label>
                <select id="category">
                    <option value="nourriture">Nourriture</option>
                    <option value="transport">Transport</option>
                    <option value="logement">Logement</option>
                    <option value="loisirs">Loisirs</option>
                    <option value="salaire">Salaire</option>
                </select>
            </div>
            <button type="submit">Ajouter</button>
        </form>
    </div>

    <div class="card">
        <h3>Historique</h3>
        <ul id="history-list"></ul>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
